<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <defs>
    <linearGradient id="logoGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
    <linearGradient id="ringGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:0.7"/>
    </linearGradient>
  </defs>
  <!-- Saturn Planet Icon -->
  <g transform="translate(8, 8)">
    <circle cx="22" cy="22" r="14" fill="url(#logoGradDark)"/>
    <ellipse cx="22" cy="22" rx="28" ry="8" fill="none" stroke="url(#ringGradDark)" stroke-width="2.5" transform="rotate(-20, 22, 22)"/>
    <circle cx="18" cy="17" r="4" fill="rgba(255,255,255,0.3)"/>
    <circle cx="4" cy="6" r="1" fill="#8b5cf6" opacity="0.7"/>
    <circle cx="40" cy="8" r="0.8" fill="#22d3ee" opacity="0.6"/>
    <circle cx="38" cy="36" r="1.2" fill="#3b82f6" opacity="0.5"/>
  </g>
  <!-- Arabic Text: زحل -->
  <text x="70" y="42" font-family="'Noto Sans Arabic', 'Segoe UI', Tahoma, Arial, sans-serif" font-size="36" font-weight="700" fill="url(#logoGradDark)" direction="rtl" unicode-bidi="bidi-override">زحل</text>
  <!-- English subtitle -->
  <text x="148" y="42" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#94a3b8" letter-spacing="0.1em">ZUHAL</text>
</svg>
