<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="50%" style="stop-color:#eff6ff"/>
      <stop offset="100%" style="stop-color:#f5f3ff"/>
    </linearGradient>
    <linearGradient id="planet1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="planet2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.08"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="600" fill="url(#heroBg)"/>
  <!-- Decorative circles / orbits -->
  <circle cx="900" cy="200" r="200" fill="url(#planet1)"/>
  <circle cx="900" cy="200" r="120" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.1"/>
  <circle cx="900" cy="200" r="160" fill="none" stroke="#7c3aed" stroke-width="0.5" opacity="0.08"/>
  <circle cx="900" cy="200" r="250" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.06"/>
  <!-- Saturn ring -->
  <ellipse cx="900" cy="200" rx="280" ry="60" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0.08" transform="rotate(-15, 900, 200)"/>
  <!-- Small decorative planets -->
  <circle cx="150" cy="450" r="80" fill="url(#planet2)"/>
  <circle cx="150" cy="450" r="50" fill="none" stroke="#06b6d4" stroke-width="0.5" opacity="0.1"/>
  <!-- Stars / dots -->
  <circle cx="100" cy="100" r="3" fill="#2563eb" opacity="0.15"/>
  <circle cx="300" cy="80" r="2" fill="#7c3aed" opacity="0.12"/>
  <circle cx="500" cy="150" r="2.5" fill="#06b6d4" opacity="0.1"/>
  <circle cx="700" cy="50" r="1.5" fill="#2563eb" opacity="0.18"/>
  <circle cx="1100" cy="100" r="2" fill="#7c3aed" opacity="0.15"/>
  <circle cx="1050" cy="450" r="3" fill="#06b6d4" opacity="0.12"/>
  <circle cx="400" cy="500" r="1.8" fill="#2563eb" opacity="0.1"/>
  <circle cx="800" cy="520" r="2.2" fill="#7c3aed" opacity="0.08"/>
  <!-- Grid pattern hint -->
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#e2e8f0" stroke-width="0.5" opacity="0.3"/>
  <line x1="600" y1="0" x2="600" y2="600" stroke="#e2e8f0" stroke-width="0.5" opacity="0.3"/>
</svg>
