<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <linearGradient id="grad404" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#grad404)" rx="24"/>
  <!-- Lost astronaut / Saturn theme -->
  <g transform="translate(200, 80)">
    <!-- Saturn -->
    <circle cx="100" cy="100" r="50" fill="#e2e8f0"/>
    <circle cx="100" cy="100" r="40" fill="#cbd5e1"/>
    <ellipse cx="100" cy="100" rx="90" ry="18" fill="none" stroke="#94a3b8" stroke-width="4" transform="rotate(-20, 100, 100)"/>
    <circle cx="85" cy="85" r="12" fill="rgba(255,255,255,0.4)"/>
    <!-- Stars scattered -->
    <circle cx="-80" cy="30" r="3" fill="#2563eb" opacity="0.3"/>
    <circle cx="280" cy="20" r="2" fill="#7c3aed" opacity="0.25"/>
    <circle cx="-60" cy="150" r="2.5" fill="#06b6d4" opacity="0.2"/>
    <circle cx="250" cy="170" r="3" fill="#2563eb" opacity="0.15"/>
    <circle cx="-100" cy="100" r="1.5" fill="#7c3aed" opacity="0.3"/>
    <circle cx="300" cy="100" r="2" fill="#06b6d4" opacity="0.25"/>
  </g>
  <!-- 404 text -->
  <text x="300" y="300" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="800" fill="#94a3b8" text-anchor="middle" opacity="0.5">404</text>
  <text x="300" y="340" font-family="'Noto Sans Arabic', Arial, sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle" opacity="0.4" font-weight="600">الصفحة غير موجودة</text>
</svg>
