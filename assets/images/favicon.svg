<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="favRing" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#favGrad)"/>
  <!-- Saturn Planet -->
  <circle cx="256" cy="256" r="100" fill="rgba(255,255,255,0.2)"/>
  <circle cx="256" cy="256" r="85" fill="rgba(255,255,255,0.15)"/>
  <!-- Ring -->
  <ellipse cx="256" cy="256" rx="180" ry="55" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="14" transform="rotate(-20, 256, 256)"/>
  <!-- Highlight -->
  <circle cx="230" cy="225" r="30" fill="rgba(255,255,255,0.2)"/>
  <!-- Arabic letter ز -->
  <text x="256" y="285" font-family="'Noto Sans Arabic', Arial, sans-serif" font-size="140" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle">ز</text>
</svg>
